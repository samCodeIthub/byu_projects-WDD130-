<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML Form - User Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>


    <main>
        <form action="#">
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form_item column2 ">
                    <label for="fullname">Full name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <br>

                <div class="form_item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Questions</legend>
                <div class="form_item column1">
                    <label for="browser">What is your favourite internet browser?</label>
                    <select name="browser" id="browser">
                        <option value="chrome">Google chrome</option>
                        <option value="brave">Brave</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Microsoft edge</option>
                    </select>
                </div>

                <br><br>
                <div class="form_item column1">
                    <label for="pet">Do you have a household pet</label>
                    <input type="checkbox" id="pet" name="pet" required>
                    <br><br>
                    <label for="feedback">List the places you have lived</label>
                    <textarea name="feedback" id="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands..."></textarea>
                </div>
            </fieldset>

            <button type="submit">Submit Poll</button>
            
        </form>
    </main>


    <footer>&copy; HTML Form - User Poll Activity | Samuel Motey Howard </footer>
</body>
</html>
