<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Rapids Whitewater Rafting Company — reach us by phone, email, or message form for reservations and inquiries.">
    <meta name="author" content="Samuel Motey Howard">
    <title>Contact Us | Rapids Whitewater Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/z-crossedoars.jpeg" alt="Crossed oars logo representing Rapids Whitewater Rafting Company">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Rapids Whitewater Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater</p>
        </section>


        <section>
            <div class="employee">
                <div class="map">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3075.8240165833163!2d-120.82394389999999!3d39.563575500000006!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809c7c6900415eef%3A0x17fbe6d878c7cf7e!2s123%20E%20River%20St%2C%20Downieville%2C%20CA%2095936%2C%20USA!5e0!3m2!1sen!2sgh!4v1780684576360!5m2!1sen!2sgh"
                        width="400"
                        height="350"
                        allowfullscreen="" 
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
                <div class="employeeInfo">
                    <form action="#">
                        <ul>
                            <li>
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" required placeholder="Name">
                            </li>
                            <li>
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" required placeholder="Email">
                            </li>
                           
                            <li class="purpose">
                                <label>Message Purpose</label>
                                <div>
                                    <div>
                                        <input type="radio" id="general" name="purpose" value="general">
                                        <label for="general">General Inquiry</label>
                                    </div>

                                    <div>
                                        <input type="radio" id="reservation" name="purpose" value="reservation">
                                        <label for="reservation">Reservation Question</label>
                                    </div>

                                    <div>
                                        <input type="radio" id="website" name="purpose" value="website">
                                        <label for="website">Website Suggestion</label>
                                    </div>
                                </div>
                            </li>
                            <li>
                                <label for="message">Message</label>
                                <br>
                                <textarea id="message" name="message" rows="5" cols="40" placeholder="Type your message here..."></textarea>
                            </li>

                            <li>
                                <input type="checkbox" id="newsletter" name="newsletter">
                                <label for="newsletter">Please Subscribe to the monthly newsletter</label>
                            </li>

                            <li>
                                <button type="submit">Get in Touch</button>
                            </li>
                        </ul>
                    </form>
                </div>
            </div>
        </section>


        <section>
            <h2>We Are Here to Serve You</h2>
            <div class="invitation">
                <figure>
                    <img src="images/employee1.jpg" alt="Portrait of Sarah Malone, Safety Instructor">
                    <figcaption>Sarah Malone - Safety Instructor</figcaption>
                </figure>
                
                <figure>
                    <img src="images/employee2.jpg" alt="Portrait of John Rivers, Head River Guide">
                    <figcaption>John Rivers - Head River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Portrait of David Kwame, Customer Experience Manager">
                    <figcaption>David Kwame - Customer Experience Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer_layout">
            <p>&copy; 2026 | Rapids Whitewater Rafting Company | Samuel Motey Howard, Ghana</p>
            <nav class="socialmedia" aria-label="Social Media Links" >
                <a href="https://www.facebook.com/"><img src="images/facebook_logo_icon_147291.png"
                      alt="Visit our Facebook page"></a>
                <a href="https://www.linkedin.com/"><img src="images/linkedin.png"
                      alt="Visit our linkedin page"></a>
                <a href="https://www.instagram.com/"><img src="images/3721672-instagram_108066.png"
                      alt="Visit our instagram page"></a>
            </nav>
        </div>
    </footer>
</body>
</html>
